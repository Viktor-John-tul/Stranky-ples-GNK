<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Website Texts</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/edit.css">

</head>
<body>
    <div class="edit-container">
      <div class="admin-header">
        <h2>Edit Website Texts</h2>
        <button id="logoutBtn" class="logout-button">Logout</button>
      </div>
      <form id="editTextsForm">
        <label>Main Text</label>
        <textarea id="editMainText"></textarea>
        <label>Date</label>
        <input type="text" id="editDate">
        <label>Place</label>
        <input type="text" id="editPlace">
        <label>Dress Code</label>
        <input type="text" id="editDresscode">
        <label>Ticket Info</label>
        <input type="text" id="editTicketInfo">
        <label>
          <input type="checkbox" id="editTicketOrdering"> Enable Ticket Ordering (Show button instead of text)
        </label>
        <button type="submit">Save Changes</button>
      </form>
      <div id="saveStatus"></div>
      
      <h2>Edit Class Configuration</h2>
      <form id="editClassesForm">
        <div class="class-config-grid">
          <div class="class-config-item">
            <label>Primy (1. ročník)</label>
            <select id="class1Count">
              <option value="2">2 třídy</option>
              <option value="3">3 třídy</option>
            </select>
          </div>
          <div class="class-config-item">
            <label>Sekundy (2. ročník)</label>
            <select id="class2Count">
              <option value="2">2 třídy</option>
              <option value="3">3 třídy</option>
            </select>
          </div>
          <div class="class-config-item">
            <label>Tercie (3. ročník)</label>
            <select id="class3Count">
              <option value="2">2 třídy</option>
              <option value="3">3 třídy</option>
            </select>
          </div>
          <div class="class-config-item">
            <label>Kvarty (4. ročník)</label>
            <select id="class4Count">
              <option value="2">2 třídy</option>
              <option value="3">3 třídy</option>
            </select>
          </div>
          <div class="class-config-item">
            <label>Kvinty (5. ročník)</label>
            <select id="class5Count">
              <option value="2">2 třídy</option>
              <option value="3">3 třídy</option>
            </select>
          </div>
          <div class="class-config-item">
            <label>Sexty (6. ročník)</label>
            <select id="class6Count">
              <option value="2">2 třídy</option>
              <option value="3">3 třídy</option>
            </select>
          </div>
          <div class="class-config-item">
            <label>Septimy (7. ročník)</label>
            <select id="class7Count">
              <option value="2">2 třídy</option>
              <option value="3">3 třídy</option>
            </select>
          </div>
          <div class="class-config-item">
            <label>Oktávy (8. ročník)</label>
            <select id="class8Count">
              <option value="2">2 třídy</option>
              <option value="3">3 třídy</option>
            </select>
          </div>
        </div>
        <button type="submit">Save Class Configuration</button>
      </form>
      <div id="classConfigStatus"></div>
    </div>
    <script>
        // Enhanced session validation
        function validateSession() {
            const isAdmin = sessionStorage.getItem('isAdmin');
            const adminToken = sessionStorage.getItem('adminToken');
            const loginTime = sessionStorage.getItem('loginTime');
            
            if (isAdmin !== 'true' || !adminToken || !loginTime) {
                window.location.href = "admin.html";
                return false;
            }
            
            // Check if session is older than 2 hours (7200000 ms)
            const currentTime = Date.now();
            if (currentTime - parseInt(loginTime) > 7200000) {
                sessionStorage.clear();
                alert('Session expired. Please log in again.');
                window.location.href = "admin.html";
                return false;
            }
            
            return true;
        }

        // Redirect to login if not properly authenticated
        if (!validateSession()) {
            // Will redirect in validateSession function
        }

        // Load current texts and class configuration
        fetch('content.json')
          .then(res => res.json())
          .then(data => {
            // Load landing page texts
            document.getElementById('editMainText').value = data.landing.mainText;
            document.getElementById('editDate').value = data.landing.date;
            document.getElementById('editPlace').value = data.landing.place;
            document.getElementById('editDresscode').value = data.landing.dresscode;
            document.getElementById('editTicketInfo').value = data.landing.ticketInfo;
            
            // Load class configuration
            if (data.classes) {
              for (let i = 1; i <= 8; i++) {
                const select = document.getElementById(`class${i}Count`);
                if (select && data.classes[i]) {
                  select.value = data.classes[i].count;
                }
              }
            }
            
            // Load ticket ordering setting
            const ticketOrderingCheckbox = document.getElementById('editTicketOrdering');
            if (ticketOrderingCheckbox && data.landing.ticketOrderingEnabled !== undefined) {
              ticketOrderingCheckbox.checked = data.landing.ticketOrderingEnabled;
            }
          });

        // Save changes (requires server-side script)
        document.getElementById('editTextsForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get current content to preserve existing data
            fetch('content.json')
              .then(res => res.json())
              .then(currentData => {
                const updated = {
                  ...currentData,
                  landing: {
                    ...currentData.landing,
                    mainText: document.getElementById('editMainText').value,
                    date: document.getElementById('editDate').value,
                    place: document.getElementById('editPlace').value,
                    dresscode: document.getElementById('editDresscode').value,
                    ticketInfo: document.getElementById('editTicketInfo').value,
                    ticketOrderingEnabled: document.getElementById('editTicketOrdering').checked
                  }
                };
                
                fetch('save_content.php', {
                  method: 'POST',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify(updated)
                })
                .then(res => res.ok ? "Saved!" : "Error saving.")
                .then(msg => document.getElementById('saveStatus').textContent = msg);
              })
              .catch(error => {
                console.error('Error:', error);
                document.getElementById('saveStatus').textContent = "Error loading current content.";
              });
        });

        // Save class configuration
        document.getElementById('editClassesForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get current content
            fetch('content.json')
              .then(res => res.json())
              .then(currentData => {
                // Update class configuration
                const classNames = {
                  "1": "Primy",
                  "2": "Sekundy", 
                  "3": "Tercie",
                  "4": "Kvarty",
                  "5": "Kvinty",
                  "6": "Sexty",
                  "7": "Septimy",
                  "8": "Oktávy"
                };

                const updatedClasses = {};
                for (let i = 1; i <= 8; i++) {
                  const count = parseInt(document.getElementById(`class${i}Count`).value);
                  updatedClasses[i] = {
                    name: classNames[i],
                    count: count
                  };
                }

                const updatedData = {
                  ...currentData,
                  classes: updatedClasses
                };

                // Save updated data
                fetch('save_content.php', {
                  method: 'POST',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify(updatedData)
                })
                .then(res => res.ok ? "Class configuration saved!" : "Error saving class configuration.")
                .then(msg => document.getElementById('classConfigStatus').textContent = msg);
              })
              .catch(error => {
                console.error('Error:', error);
                document.getElementById('classConfigStatus').textContent = "Error loading current configuration.";
              });
        });

        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', function() {
            if (confirm('Are you sure you want to logout?')) {
                sessionStorage.clear();
                window.location.href = "admin.html";
            }
        });

        // Refresh login time on activity (extends session)
        let activityTimer;
        function refreshSession() {
            sessionStorage.setItem('loginTime', Date.now().toString());
        }

        function resetActivityTimer() {
            clearTimeout(activityTimer);
            activityTimer = setTimeout(refreshSession, 300000); // Refresh every 5 minutes of activity
        }

        // Listen for user activity
        ['mousedown', 'keydown', 'scroll', 'click'].forEach(event => {
            document.addEventListener(event, resetActivityTimer, true);
        });

        // Start the activity timer
        resetActivityTimer();
    </script>
</body>
</html>
