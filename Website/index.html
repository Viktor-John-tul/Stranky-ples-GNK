<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maturitní ples GNK</title>
    <link rel="stylesheet" href="./css/index.css"> <!-- External CSS -->
</head>
<body>
    <div class="landing-page">
        <!-- Dropdown Menu -->
        <div class="web-dropdown-menu">
            <button class="web-dropdown-button">Menu</button>
            <div class="web-dropdown-content">
                <a href="index.html" id="link1">Informace</a>
                <a href="Order.html" id="link2">Koupit lístky</a>
                <a href="https://www.kavalirka.cz" id="external-link">Stránky školy</a>
            </div>
        </div>

        <!-- Landing Page Content -->
        <div class="landing-content">
            <div class="text-and-poster">
                <!-- Poster Section -->
                <div class="poster">
                    <img src="./images/plakat.png" alt="Graduation Ball Poster">
                </div>

                <!-- Text Section -->
                <div class="text">
                    <h1 id="pageTitle">Maturitní ples <br>Gymnázia Nad Kavalírkou</h1>
                    <p id="mainText">
                        <!-- Content will be dynamically loaded -->
                    </p>
                    <p id="detailsText">
                        <!-- Content will be dynamically loaded -->
                    </p>

                    <!-- Buttons -->
                    <div class="landing-buttons" id="ticketSection">
                        <!-- Content will be dynamically loaded -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load content configuration and update page dynamically
        fetch('content.json')
            .then(response => response.json())
            .then(data => {
                // Update title
                const pageTitle = document.getElementById('pageTitle');
                if (pageTitle && data.landing.title) {
                    pageTitle.innerHTML = data.landing.title;
                }

                // Update main text content
                const mainText = document.getElementById('mainText');
                if (mainText && data.landing.mainText) {
                    mainText.innerHTML = data.landing.mainText;
                }

                // Update details text
                const detailsText = document.getElementById('detailsText');
                if (detailsText && data.landing.date && data.landing.place && data.landing.dresscode) {
                    detailsText.innerHTML = `
                        <strong>Kdy?</strong> ${data.landing.date}<br>
                        <strong>Kde?</strong> ${data.landing.place}<br>
                        <strong>Dress code:</strong> ${data.landing.dresscode}
                    `;
                }

                // Update ticket section based on configuration
                const ticketSection = document.getElementById('ticketSection');
                const orderLink = document.getElementById('link2');
                
                if (data.landing.ticketOrderingEnabled) {
                    // Show button and keep order link in dropdown
                    ticketSection.innerHTML = '<a href="./Order.html" class="large-button">Objednat lístky</a>';
                    if (orderLink) {
                        orderLink.style.display = 'block';
                    }
                } else {
                    // Show text only and hide order link in dropdown
                    ticketSection.innerHTML = `<h3>${data.landing.ticketInfo}</h3>`;
                    if (orderLink) {
                        orderLink.style.display = 'none';
                    }
                }
            })
            .catch(error => {
                console.error('Error loading content:', error);
                // Fallback content
                const pageTitle = document.getElementById('pageTitle');
                if (pageTitle) {
                    pageTitle.innerHTML = 'Maturitní ples <br>Gymnázia Nad Kavalírkou';
                }

                const mainText = document.getElementById('mainText');
                if (mainText) {
                    mainText.innerHTML = 'Srdečně vás zveme na slavnostní večer plný elegance, radosti a nezapomenutelných okamžiků.';
                }

                const detailsText = document.getElementById('detailsText');
                if (detailsText) {
                    detailsText.innerHTML = `
                        <strong>Kdy?</strong> 19. 2. 2025 v 19:00<br>
                        <strong>Kde?</strong> Velký sál Lucerny<br>
                        <strong>Dress code:</strong> Maska nebo doplněk ve stylu maškarního bálu
                    `;
                }

                const ticketSection = document.getElementById('ticketSection');
                ticketSection.innerHTML = '<h3>Lístky je už možné koupit pouze na vrátnici nebo v Lucerně.</h3>';
                
                const orderLink = document.getElementById('link2');
                if (orderLink) {
                    orderLink.style.display = 'none';
                }
            });

        // Get the current page's URL
        const currentURL = window.location.href;

        // Define the mapping of page names to their links
        const pageLinks = {
            "link1": "index.html",
            "link2": "Order.html",
            "external-link": "https://www.kavalirka.cz"
        };

        // Highlight the current page and disable the corresponding link
        for (const [id, url] of Object.entries(pageLinks)) {
            const link = document.getElementById(id);
            if (link && currentURL.includes(url.split('/').pop())) {
                link.classList.add("disabled");
                break;
            }
        }
    </script>
</body>
</html>
